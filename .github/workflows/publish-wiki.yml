name: Publish wiki

# The wiki pages live in wiki/ in this repository so a documentation change is
# reviewed alongside the code change that caused it. GitHub serves the wiki from
# a separate repository (<repo>.wiki.git) that a normal push never touches, so
# this job mirrors one into the other whenever wiki/ changes on main.
#
# Prerequisite, once per repository: Settings -> Features -> tick "Wikis", then
# save any page in the web UI. GitHub does not create the wiki repository until
# it has a first page, and this job cannot create it.

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "scripts/publish_wiki.py"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:
    inputs:
      message:
        description: "Commit message for the wiki commit"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # The wiki has no branches; two jobs pushing at once would race.
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Mirror wiki/ to the GitHub wiki
    runs-on: ubuntu-latest

    steps:
      - name: Check out the source repository
        uses: actions/checkout@v4
        with:
          # publish_wiki.py derives its commit message from the last commit.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIKI_REMOTE_URL: https://github.com/${{ github.repository }}.wiki.git
          WIKI_GIT_NAME: ${{ github.actor }}
          WIKI_GIT_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: |
          if [ -n "${{ github.event.inputs.message }}" ]; then
            python scripts/publish_wiki.py -m "${{ github.event.inputs.message }}"
          else
            python scripts/publish_wiki.py
          fi
