# Sidebar navigation.
#
# `page` names a file in docs/ without its extension. `label` overrides the
# sidebar text, because a page title and a nav label want different things: the
# title says what the page is, the label has to survive a 240px column without
# wrapping. "Code Reference — Alert Pipeline Modules" is a good title and a bad
# label. Without a label the page's own heading is used.
- group: Understanding
  pages:
    - { page: Project-Overview, label: Overview }
    - { page: Architecture, label: Architecture }
    - { page: Repository-Layout, label: Repository Layout }
    - { page: Roadmap, label: Roadmap }
    - { page: Anti-Patterns, label: Anti-Patterns }
    - { page: Glossary, label: Glossary }
    - { page: FAQ, label: FAQ }

- group: Running it
  pages:
    - { page: Getting-Started, label: Getting Started }
    - { page: Configuration, label: Configuration }
    - { page: Testing, label: Testing }
    - { page: Docs-Publishing, label: Publishing }

- group: Machine learning
  pages:
    - { page: Data-Pipeline, label: Data Pipeline }
    - { page: ML-Models, label: Models }

- group: System
  pages:
    - { page: API-Reference, label: API Reference }
    - { page: Database-Schema, label: Database Schema }
    - { page: Frontend-Screens, label: Dashboard Screens }

- group: Code reference
  pages:
    - { page: Code-Backend-Core, label: Backend Core }
    - { page: Code-Backend-Routes, label: API Routes }
    - { page: Code-Backend-Pipeline, label: Alert Pipeline }
    - { page: Code-Backend-Training, label: Training }
    - { page: Code-Backend-Migrations, label: Migrations }
    - { page: Code-Backend-Tests, label: Backend Tests }
    - { page: Code-Frontend, label: Frontend }
    - { page: Code-Infrastructure, label: Infrastructure }
