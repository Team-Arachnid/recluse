<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>

  <header class="topbar">
    <button class="topbar__menu" type="button" aria-expanded="false" aria-controls="sidebar" data-menu>
      <span class="topbar__bars" aria-hidden="true"></span>
      <span class="u-visually-hidden">Menu</span>
    </button>

    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name">Recluse</span>
    </a>

    <div class="search" data-search>
      <input class="search__input" type="search" id="search-input" autocomplete="off" spellcheck="false"
             placeholder="Search the documentation" aria-label="Search the documentation"
             aria-expanded="false" aria-controls="search-results" role="combobox">
      <kbd class="search__key" aria-hidden="true">/</kbd>
      <div class="search__panel" id="search-results" role="listbox" hidden></div>
    </div>

    <a class="topbar__repo" href="{{ site.repo_url }}">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/></svg>
      <span class="u-visually-hidden">Repository on GitHub</span>
    </a>
  </header>

  <div class="shell">
    {% include sidebar.html %}
    <div class="scrim" data-scrim hidden></div>
    <main class="main" id="content">
      {{ content }}
      <footer class="footer">
        <p>Authored in <a href="{{ site.repo_url }}/tree/main/docs"><code>docs/</code></a> and published on every push to <code>main</code>.</p>
        <p>The system alerts, ranks and explains. It never blocks traffic.</p>
      </footer>
    </main>
  </div>

  <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
</body>
</html>
